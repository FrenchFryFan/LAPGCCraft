
#KubeJS Studio Performance Patch Configuration
#KubeJS Studio パフォーマンスパッチ設定
[general]
	#Enables instant opening of item picker dialogs without freezing by delaying full hover-name resolution.
	#アイテム選択ダイアログを開く際の完全なホバー名解決を遅延させ、フリーズを防止して即時オープンを有効にします。
	enableLazyHoverName = true
	#Enables pre-tokenized fast item/block/recipe search engine.
	#トークン事前分割による高速なアイテム/ブロック/レシピ検索エンジンを有効にします。
	enableFastSearch = true
	#Threshold of entries count to trigger parallel multi-threaded filtering.
	#マルチスレッド並列フィルタリングを作動させるエントリ件数のしきい値。
	#Range: 100 ~ 100000
	parallelSearchThreshold = 800
	#Enables multi-threaded asynchronous file searching (Find in Files).
	#ファイル検索（Find in Files）のマルチスレッド高速並列化を有効にします。
	enableFastFileSearch = true
	#Number of worker threads for parallel file searching. (0 = Auto: based on available CPU cores)
	#並列ファイル検索のワーカースレッド数。（0 = 自動: 利用可能なCPUコア数に合わせる）
	#Range: 0 ~ 64
	fileSearchThreads = 0
	#Enables memory caching of GameState registry entries and tag options to prevent redundant allocations.
	#無駄なオブジェクト生成を防ぐため、GameStateのレジストリエントリおよびタグオプションのメモリキャッシュを有効にします。
	enableRegistryCache = true
	#Enables fix for entity loot table drops inspection and test rolling fallback.
	#エンティティ等のルートテーブルのドロップ品確認およびテスト抽選のフォールバック修正を有効にします。
	enableLootFix = true
	#Forces UTF-8 encoding for all KubeJS Studio file read/write operations to prevent mojibake on Windows.
	#Windows環境での文字化けを防ぐため、KubeJS Studioのファイル読み書きをすべてUTF-8に強制します。
	enableUtf8Fix = true
	#Enables font fallback to vanilla font in non-Latin/Japanese environments to prevent tofu/mojibake characters.
	#日本語等の非ラテン環境で文字化け・豆腐表示を防ぐため、バニラフォントへの適切なフォールバックを有効にします。
	enableFontFix = true

